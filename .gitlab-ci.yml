stages:
  - test

variables:
  API_BASE_URL: "https://openlyst.ink/api/v1"

# API Integration Tests - Manual trigger only
api-tests:
  stage: test
  image: curlimages/curl:latest
  when: manual
  rules:
    - when: manual
      allow_failure: true
  script:
    - echo "🧪 Starting API Tests for $API_BASE_URL"
    - echo ""
    
    # Test /api/v1/repo
    - echo "📦 Testing /repo endpoint..."
    - |
      response=$(curl -s -w "\n%{http_code}" "$API_BASE_URL/repo")
      http_code=$(echo "$response" | tail -n1)
      body=$(echo "$response" | sed '$d')
      if [ "$http_code" -eq 200 ]; then
        echo "✅ /repo - Status: $http_code"
      else
        echo "❌ /repo - Status: $http_code"
        echo "$body"
        exit 1
      fi
    
    # Test /api/v1/apps
    - echo ""
    - echo "📱 Testing /apps endpoint..."
    - |
      response=$(curl -s -w "\n%{http_code}" "$API_BASE_URL/apps")
      http_code=$(echo "$response" | tail -n1)
      body=$(echo "$response" | sed '$d')
      if [ "$http_code" -eq 200 ]; then
        echo "✅ /apps - Status: $http_code"
      else
        echo "❌ /apps - Status: $http_code"
        echo "$body"
        exit 1
      fi
    
    # Test /api/v1/apps?filter=active
    - echo ""
    - echo "📱 Testing /apps?filter=active endpoint..."
