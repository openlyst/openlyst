    # Test 404 for non-existent app
    - echo ""
    - echo "🚫 Testing 404 for non-existent app..."
    - |
      response=$(curl -s -w "\n%{http_code}" "$API_BASE_URL/apps/nonexistent-app-12345")
      http_code=$(echo "$response" | tail -n1)
      if [ "$http_code" -eq 404 ]; then
        echo "✅ /apps/nonexistent-app-12345 - Status: $http_code (expected 404)"
      else
        echo "❌ /apps/nonexistent-app-12345 - Status: $http_code (expected 404)"
        exit 1
      fi
    
    - echo ""
    - echo "🎉 All API tests passed!"
