<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project Logo">
  <!-- Background square with rounded corners -->
  <rect width="200" height="200" rx="30" ry="30" fill="#4185A9" />
  
  <!-- Three interconnected shapes representing platforms -->
  <!-- iOS: circle -->
  <circle cx="60" cy="60" r="30" fill="#5CA399" />
  
  <!-- Android: rounded square -->
  <rect x="110" y="45" width="50" height="50" rx="12" ry="12" fill="#F4A261" />
  
  <!-- Desktop: hexagon -->
  <polygon points="100,140 130,120 130,160 100,180 70,160 70,120" fill="#E76F51" />
</svg>

