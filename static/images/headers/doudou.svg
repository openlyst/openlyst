<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with subtle pattern -->
  <rect width="1200" height="300" rx="20" fill="url(#bgGradient)" />
  
  <!-- Decorative circles -->
  <circle cx="1100" cy="50" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="1050" cy="250" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="100" cy="250" r="60" fill="#ffffff" opacity="0.08"/>
  
  <!-- Shimmer overlay -->
  <rect width="1200" height="300" rx="20" fill="url(#shimmer)" opacity="0.5"/>
  
  <!-- Music Note Icon with modern design -->
  <g transform="translate(90, 120)" filter="url(#glow)">
    <circle cx="0" cy="0" r="50" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="45" fill="#ffffff" opacity="0.2"/>
    <g transform="translate(-20, -20)">
      <path d="M28 8v16a6 6 0 1 0 4 0V12h10V8H28z M30 28a4 4 0 1 1 0-8 4 4 0 0 1 0 8z" fill="#ffffff" filter="url(#softShadow)"/>
      <circle cx="30" cy="24" r="2" fill="#e0e7ff"/>
    </g>
  </g>
  
  <!-- App Name with shadow -->
  <text x="180" y="115" font-size="64" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" fill="#000000" opacity="0.2" font-weight="800" letter-spacing="-2">
    Doudou
  </text>
  <text x="180" y="113" font-size="64" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff" font-weight="800" letter-spacing="-2">
    Doudou
  </text>
  
  <!-- Tagline with modern styling -->
  <text x="180" y="155" font-size="20" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff" opacity="0.9" font-weight="500" letter-spacing="0.5">
    Your vibe. Your rhythm. Every day.
  </text>
  <text x="470" y="155" font-size="24" fill="#ffffff" opacity="0.9">🎧</text>
  
  <!-- Track List Card -->
  <g transform="translate(720, 50)">
    <rect width="440" height="200" rx="16" fill="#ffffff" opacity="0.12" filter="url(#softShadow)"/>
    <rect width="440" height="200" rx="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    
    <text x="24" y="32" font-size="18" font-family="'SF Pro Text', sans-serif" fill="#ffffff" font-weight="700" letter-spacing="0.5" opacity="0.9">
      TOP TRACKS
    </text>
    
    <!-- Track items with hover effect look -->
    <g opacity="0.95">
      <text x="24" y="68" font-size="16" font-family="'SF Pro Text', sans-serif" fill="#ffffff" font-weight="500">
        <tspan font-weight="600">1.</tspan> Purple Pulse <tspan opacity="0.7">· Luna Sky</tspan>
      </text>
      <text x="24" y="98" font-size="16" font-family="'SF Pro Text', sans-serif" fill="#ffffff" font-weight="500">
        <tspan font-weight="600">2.</tspan> Neon Nights <tspan opacity="0.7">· The Echoes</tspan>
      </text>
      <text x="24" y="128" font-size="16" font-family="'SF Pro Text', sans-serif" fill="#ffffff" font-weight="500">
        <tspan font-weight="600">3.</tspan> Beats & Vibes <tspan opacity="0.7">· DJ Koko</tspan>
      </text>
      <text x="24" y="158" font-size="16" font-family="'SF Pro Text', sans-serif" fill="#ffffff" font-weight="500">
        <tspan font-weight="600">4.</tspan> Midnight Flow <tspan opacity="0.7">· ZARA</tspan>
      </text>
      <text x="24" y="188" font-size="16" font-family="'SF Pro Text', sans-serif" fill="#ffffff" font-weight="500">
        <tspan font-weight="600">5.</tspan> Dream Loop <tspan opacity="0.7">· LoFreak</tspan>
      </text>
    </g>
    
    <!-- Play icons -->
    <g opacity="0.6">
      <circle cx="400" cy="63" r="8" fill="#ffffff" opacity="0.3"/>
      <path d="M397 60 l6 3 l-6 3 Z" fill="#ffffff"/>
      
      <circle cx="400" cy="93" r="8" fill="#ffffff" opacity="0.3"/>
      <path d="M397 90 l6 3 l-6 3 Z" fill="#ffffff"/>
      
      <circle cx="400" cy="123" r="8" fill="#ffffff" opacity="0.3"/>
      <path d="M397 120 l6 3 l-6 3 Z" fill="#ffffff"/>
      
      <circle cx="400" cy="153" r="8" fill="#ffffff" opacity="0.3"/>
      <path d="M397 150 l6 3 l-6 3 Z" fill="#ffffff"/>
      
      <circle cx="400" cy="183" r="8" fill="#ffffff" opacity="0.3"/>
      <path d="M397 180 l6 3 l-6 3 Z" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- Decorative waveform accent -->
  <g transform="translate(180, 190)" opacity="0.4">
    <rect x="0" y="0" width="3" height="20" rx="1.5" fill="#ffffff">
      <animate attributeName="height" values="20;35;20" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="0;-7.5;0" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="8" y="5" width="3" height="15" rx="1.5" fill="#ffffff">
      <animate attributeName="height" values="15;28;15" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="5;-1.5;5" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="3" width="3" height="18" rx="1.5" fill="#ffffff">
      <animate attributeName="height" values="18;30;18" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="3;-3;3" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="7" width="3" height="12" rx="1.5" fill="#ffffff">
      <animate attributeName="height" values="12;25;12" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="7;0.5;7" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="32" y="4" width="3" height="16" rx="1.5" fill="#ffffff">
      <animate attributeName="height" values="16;32;16" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="4;-4;4" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>