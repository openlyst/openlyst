<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doudou-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" rx="20" fill="url(#doudou-bg)" />
  
  <!-- Decorative circles -->
  <circle cx="1100" cy="50" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="1050" cy="250" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="100" cy="250" r="60" fill="#ffffff" opacity="0.08"/>
  
  <!-- Music Note Icon -->
  <g transform="translate(90, 150)">
    <circle cx="0" cy="0" r="50" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="45" fill="#ffffff" opacity="0.2"/>
    
    <!-- Musical note -->
    <g transform="translate(-15, -15)" fill="#ffffff">
      <circle cx="8" cy="20" r="4"/>
      <circle cx="22" cy="16" r="4"/>
      <rect x="11" y="4" width="2" height="18"/>
      <rect x="25" y="0" width="2" height="18"/>
      <path d="M 13 4 L 27 0 L 27 12 L 13 16 Z"/>
    </g>
  </g>
  
  <!-- App Name -->
  <g transform="translate(200, 150)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">
      DouDou
    </text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#ffffff" opacity="0.85">
      Revolutionary Music Player
    </text>
  </g>
  
  <!-- Status badge -->
  <g transform="translate(1000, 100)">
    <rect x="0" y="0" width="100" height="30" rx="15" fill="#22c55e"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">
      RELEASED
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="950" cy="80" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="800" cy="100" r="6" fill="#ffffff" opacity="0.4"/>
  <circle cx="750" cy="200" r="10" fill="#ffffff" opacity="0.2"/>
</svg>