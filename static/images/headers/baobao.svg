<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baobao-bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="baobao-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="baobao-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="baobao-softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with subtle pattern -->
  <rect width="1200" height="300" rx="20" fill="url(#baobao-bgGradient)" />
  
  <!-- Decorative circles -->
  <circle cx="1100" cy="50" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="1050" cy="250" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="100" cy="250" r="60" fill="#ffffff" opacity="0.08"/>
  
  <!-- Shimmer overlay -->
  <rect width="1200" height="300" rx="20" fill="url(#baobao-shimmer)" opacity="0.5"/>
  
  <!-- Fox Icon with modern design -->
  <g transform="translate(90, 150)" filter="url(#baobao-glow)">
    <circle cx="0" cy="0" r="50" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="45" fill="#ffffff" opacity="0.2"/>
    
    <!-- Fox head -->
    <g transform="translate(-15, -15)">
      <!-- Main head -->
      <ellipse cx="15" cy="10" rx="12" ry="10" fill="#ffffff" opacity="0.9"/>
      
      <!-- Ears -->
      <path d="M 5 0 L 10 -8 L 15 0 Z" fill="#ffffff" opacity="0.9"/>
      <path d="M 15 0 L 20 -8 L 25 0 Z" fill="#ffffff" opacity="0.9"/>
      
      <!-- Inner ears -->
      <path d="M 7 -2 L 10 -6 L 13 -2 Z" fill="#fbbf24" opacity="0.8"/>
      <path d="M 17 -2 L 20 -6 L 23 -2 Z" fill="#fbbf24" opacity="0.8"/>
      
      <!-- Eyes -->
      <circle cx="11" cy="8" r="1.5" fill="#1f2937"/>
      <circle cx="19" cy="8" r="1.5" fill="#1f2937"/>
      
      <!-- Nose -->
      <path d="M 15 12 L 13 14 L 17 14 Z" fill="#1f2937"/>
      
      <!-- Snout -->
      <ellipse cx="15" cy="16" rx="4" ry="3" fill="#ffffff" opacity="0.7"/>
    </g>
  </g>
  
  <!-- App Name -->
  <g transform="translate(200, 170)" filter="url(#baobao-softShadow)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="64" font-weight="800" fill="#ffffff" opacity="0.95">
      BaoBao
    </text>
    <text x="0" y="40" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#ffffff" opacity="0.85">
      Privacy-Focused e621 Client
    </text>
  </g>
  
  <!-- Floating geometric shapes -->
  <g opacity="0.3">
    <!-- Triangles -->
    <path d="M 950 80 L 970 60 L 990 80 L 970 100 Z" fill="#ffffff" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" values="0 970 80;360 970 80" dur="8s" repeatCount="indefinite"/>
    </path>
    
    <!-- Hexagon -->
    <path d="M 800 200 L 815 190 L 830 200 L 830 220 L 815 230 L 800 220 Z" fill="#ffffff" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 815 210;-360 815 210" dur="12s" repeatCount="indefinite"/>
    </path>
    
    <!-- Circles -->
    <circle cx="750" cy="100" r="8" fill="#ffffff" opacity="0.4">
      <animate attributeName="cy" values="100;120;100" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="120" r="6" fill="#ffffff" opacity="0.3">
      <animate attributeName="cy" values="120;100;120" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Decorative lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.2">
    <line x1="300" y1="50" x2="700" y2="50">
      <animate attributeName="stroke-dasharray" values="0 400;200 200;400 0" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="250" x2="700" y2="250">
      <animate attributeName="stroke-dasharray" values="400 0;200 200;0 400" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Status badge -->
  <g transform="translate(1000, 100)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#ffffff" opacity="0.2"/>
    <text x="60" y="20" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">
      IN DEVELOPMENT
    </text>
  </g>
</svg>
